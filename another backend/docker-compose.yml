# Start everything with:  docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-expireguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expireguard}
      POSTGRES_DB: ${POSTGRES_DB:-expireguard}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-expireguard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy        # wait until Postgres is ready
    environment:
      # Inside Docker the database host is "db" (the service name), not localhost.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-expireguard}:${POSTGRES_PASSWORD:-expireguard}@db:5432/${POSTGRES_DB:-expireguard}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SMS_MODE: ${SMS_MODE:-mock}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app                     # edit code locally, container sees it
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
